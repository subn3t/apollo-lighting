; Throwaway diagnostic — drives all 10 PWM channels at full duty, forever.
; Use to probe every channel with a meter simultaneously, or to confirm every
; strip lights at the same time. Not part of the firmware build. Flash with:
;   pio run -d tools/all-on -t upload
;   pio device monitor -d tools/all-on
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
