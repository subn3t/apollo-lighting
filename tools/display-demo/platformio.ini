; Throwaway test project — a power-on demo sequence for the HT16K33
; 7-segment display backpack. Flash with:
;   pio run -d tools/display-demo -t upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit LED Backpack Library
