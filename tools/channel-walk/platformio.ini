; Throwaway diagnostic — marches one PWM channel at a time at full duty so you
; can verify each GPIO -> MOSFET -> strip pairing visually (or with a meter).
; Not part of the firmware build. Flash with:
;   pio run -d tools/channel-walk -t upload
;   pio device monitor -d tools/channel-walk
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
